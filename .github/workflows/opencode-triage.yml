name: opencode-triage

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: opencode-triage-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  triage:
    # Cheap filter over the `issues: opened` payload. It is NOT authoritative:
    # labels added after `opened` are not in the payload, so the job re-reads the
    # live issue through the API right before writing (see the guard step).
    if: |
      !github.event.issue.pull_request &&
      github.event.issue.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      !contains(github.event.issue.labels.*.name, 'skip-triage') &&
      !contains(github.event.issue.labels.*.name, 'needs-info') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent') &&
      !contains(github.event.issue.labels.*.name, 'ready-for-human') &&
      !contains(github.event.issue.labels.*.name, 'wontfix')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No GITHUB_TOKEN scopes: every write below uses the PAT, because a comment
    # authored by github-actions[bot] does not trigger opencode.yml.
    permissions: {}
    steps:
      - name: Require AGENT_PUSH_TOKEN
        env:
          AGENT_PUSH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
        run: |
          if [ -z "$AGENT_PUSH_TOKEN" ]; then
            echo "::error::AGENT_PUSH_TOKEN is required to post the triage comment."
            exit 1
          fi

      # The guard script lives in the repository, and the runner starts with an
      # empty workspace. Check out `main` so `.github/scripts/triage-guard.sh`
      # exists before the live re-check runs.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The payload may be stale: a label such as `ready-for-agent` can be added
      # after `opened`. Re-read the live issue and stop with success, without
      # touching labels or comments, when triage is not wanted.
      - name: Re-check live issue state
        id: guard
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          decision="$(.github/scripts/triage-guard.sh "${{ github.event.issue.number }}")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Apply needs-triage label
        if: steps.guard.outputs.decision == 'run'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-label needs-triage

      - name: Request triage through opencode
        if: steps.guard.outputs.decision == 'run'
        env:
          GH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body '/oc <!-- opencode-auto-triage --> Разбери новое обращение строго по скиллу .agents/skills/triage/SKILL.md и его AGENT-BRIEF.md/OUT-OF-SCOPE.md: проверь актуальность и дубли, при необходимости обнови метки и предложи следующий шаг. Каждый комментарий триажа начинай с "> *This was generated by AI during triage.*". Оставь у issue ровно одну категорийную метку (bug или enhancement) и ровно одну state-метку (needs-triage, needs-info, ready-for-agent, ready-for-human, wontfix); для ready-for-agent опубликуй agent brief по AGENT-BRIEF.md, а при совпадении с .out-of-scope/ поставь wontfix и объясни решение в комментарии. Код не меняй.'
