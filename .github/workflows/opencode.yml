name: opencode

on:
  # Only discussion comments. Deliberately not `pull_request_review_comment`:
  # that event sets GITHUB_REF to the PR merge commit, so `actions/checkout`
  # would place PR code in the workspace before the agent runs with
  # AGENT_PUSH_TOKEN. Use the PR conversation for `/oc` instead of inline.
  issue_comment:
    types: [created]

permissions: {}

# Each admitted /oc request on a pull request consumes one attempt from a fixed
# budget. The counter is the Actions run history: every run and every re-run is
# recorded by GitHub, the gate reads it with `actions: read`, and the report
# comment below is informational only. A new PR number gets a new run title and
# therefore a new budget; comments on plain issues are not limited. The limit
# holds while the run history is retained and this workflow is unmodified; a
# repository administrator can change either condition.
# A command counts only at the start of the comment. Matching the substring
# anywhere would let an agent report that quotes /oc start another run.
run-name: ${{ (startsWith(github.event.comment.body, '/oc') || startsWith(github.event.comment.body, '/opencode')) && 'opencode-request' || 'opencode-idle' }} ${{ github.event.pull_request && 'pr' || (github.event.issue.pull_request && 'pr' || 'issue') }}-${{ github.event.issue.number || github.event.pull_request.number }}

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  OPENCODE_PR_RUN_LIMIT: "3"

jobs:
  review:
    # The trigger comment is posted by opencode-review.yml on pull_request_target.
    # It carries this marker and runs the dedicated read-only `review` agent.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(github.event.comment.body, 'This was generated by AI during automatic review') &&
      contains(github.event.comment.body, '<!-- opencode-auto-review -->') &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A new commit on the same PR cancels a stale review that is still running.
    concurrency:
      group: opencode-review-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # The reviewer only reads the repository and publishes its own comment.
    # Never give it AGENT_PUSH_TOKEN: the action writes TOKEN into .git/config,
    # and the reviewer parses untrusted pull request text.
    permissions:
      contents: read
      # The action reacts to the trigger comment and posts the review into the
      # PR conversation. For a pull request comment GitHub checks the pull
      # requests scope; `issues: write` alone produced 403 "Resource not
      # accessible by integration". The `review` agent itself stays read-only
      # via opencode.json, not via a reduced GITHUB_TOKEN.
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Issue comments always run from the default branch. Pin it explicitly
          # so the guard script below can never come from PR code.
          ref: ${{ github.event.repository.default_branch }}
          # Full history keeps `git show origin/<default>:REVIEW.md` and the merge
          # base available, so the criteria come from the base branch.
          fetch-depth: 0
          persist-credentials: false

      # The action checks out the PR branch before running the agent. Snapshot
      # the reviewer config from the base branch first and load only that file:
      # a PR must not be able to redefine the `review` agent or widen its
      # permissions through its own opencode.json or .opencode directory.
      - name: Pin trusted reviewer config
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git show "origin/${DEFAULT_BRANCH}:opencode.json" > "$RUNNER_TEMP/opencode-review.json"
          test -s "$RUNNER_TEMP/opencode-review.json"
          # Fail closed instead of letting the action fall back to the default
          # build agent when the base branch has no `review` agent yet. Drop the
          # MCP servers from the copy: the reviewer must not reach external tools.
          node -e '
            const fs = require("fs");
            const path = process.argv[1];
            const cfg = JSON.parse(fs.readFileSync(path, "utf8"));
            if (!cfg.agent || !cfg.agent.review) {
              console.error("base opencode.json has no review agent");
              process.exit(1);
            }
            delete cfg.mcp;
            fs.writeFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          ' "$RUNNER_TEMP/opencode-review.json"

      # Count earlier review triggers before the model is invoked. The request
      # workflow stops posting at the limit already, but a manual marker comment
      # must not bypass it. The current comment is excluded so the last allowed
      # request still runs. The guard is read from the base branch, like the
      # pinned reviewer config, so a modified file in the PR branch can never be
      # executed here; the job only runs on `issue_comment`, whose initial
      # checkout is already the default branch, so this is defense-in-depth.
      - name: Check auto-review limit
        id: limit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
          MAX_AUTO_REVIEWS_PER_PR: ${{ vars.MAX_AUTO_REVIEWS_PER_PR }}
        run: |
          set -euo pipefail
          git show "origin/${DEFAULT_BRANCH}:.github/scripts/review-guard.sh" > "$RUNNER_TEMP/review-guard.sh"
          test -s "$RUNNER_TEMP/review-guard.sh"
          decision="$(bash "$RUNNER_TEMP/review-guard.sh" "$PR_NUMBER" "$COMMENT_ID")"
          echo "decision=$decision" >> "$GITHUB_OUTPUT"

      - name: Run OpenCode review
        if: steps.limit.outputs.decision == 'run'
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # Ephemeral GITHUB_TOKEN, not the PAT: least privilege for an agent
          # that reads untrusted content from the pull request.
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read OPENCODE_CONFIG (<base>/opencode.json) and disable project
          # config discovery, so the PR branch cannot override the reviewer.
          OPENCODE_CONFIG: ${{ runner.temp }}/opencode-review.json
          OPENCODE_DISABLE_PROJECT_CONFIG: "true"
          OPENCODE_CONFIG_PROJECT_DISABLE: "true"
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: review
          mentions: '/oc,/opencode'
          share: 'false'
          use_github_token: true

  triage:
    # The trigger comment is posted by opencode-triage.yml on issues: opened.
    # Guard the event explicitly: only issue_comment is a trigger, and the
    # checkout below must stay on the default branch for this job.
    if: |
      github.event_name == 'issue_comment' &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(github.event.comment.body, 'This was generated by AI during automatic review') &&
      contains(github.event.comment.body, '<!-- opencode-auto-triage -->') &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: opencode-triage-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    # Triage only reads the repository and edits its issue (labels, comments).
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: triage
          mentions: '/oc,/opencode'
          share: 'false'
          use_github_token: true

  budget:
    # Only maintainers and only an explicit command can spend an attempt. The
    # live Actions history is read here, before the model is called.
    # Automated triage and review triggers also contain `/oc`, but they run
    # their own dedicated jobs; excluding their markers keeps the build agent
    # (and its PAT) out of those flows.
    if: |
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
      !contains(github.event.comment.body, 'This was generated by AI during automatic review') &&
      !contains(github.event.comment.body, '<!-- opencode-auto-review -->') &&
      !contains(github.event.comment.body, '<!-- opencode-auto-triage -->') &&
      (startsWith(github.event.comment.body, '/oc') ||
       startsWith(github.event.comment.body, '/opencode'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      allowed: ${{ steps.budget.outputs.allowed }}
      used: ${{ steps.budget.outputs.used }}
      limit: ${{ steps.budget.outputs.limit }}
      reason: ${{ steps.budget.outputs.reason }}
      detail: ${{ steps.budget.outputs.detail }}
      last_sha: ${{ steps.budget.outputs.last_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate and the report must run the trusted script from the
          # workflow's own commit, never a copy a pull request could change.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Count admitted runs for this pull request
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.pull_request && github.event.issue.number || github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          OPENCODE_PR_RUN_LIMIT: ${{ env.OPENCODE_PR_RUN_LIMIT }}
        run: bash .github/scripts/opencode-budget.sh

  opencode:
    needs: budget
    # After the budget is exhausted the model is never reached: this job is
    # skipped and only the report job below runs. Only issue_comment is a
    # trigger; the explicit guard keeps the merge-commit ref of inline comments
    # out of this job's workspace and token path.
    if: |
      github.event_name == 'issue_comment' &&
      needs.budget.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # The budget lives in the run history. The gate reads it with
      # `actions: read`; the job never grants `actions: write` for that source.
      actions: read
    outputs:
      reason: ${{ steps.classify.outputs.reason }}
      detail: ${{ steps.classify.outputs.detail }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # The agent commits its work before pushing. Runners have no git identity,
      # so `git commit` fails with "Author identity unknown" without this step.
      - name: Configure git identity
        run: |
          git config --global user.name "opencode-agent[bot]"
          git config --global user.email "opencode-agent[bot]@users.noreply.github.com"

      # With `use_github_token: true` opencode does not configure git credentials
      # itself, and the checkout runs with `persist-credentials: false`, so
      # `git push` would fail with "could not read Username for 'https://github.com'".
      # Set the same header opencode would set when it exchanges an app token.
      - name: Configure git credentials
        env:
          TOKEN: ${{ secrets.AGENT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          header=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $header"

      # A missing key or an unreachable installer is an infrastructure problem,
      # not an agent failure. Detect it before the model can be called.
      - name: Preflight the agent toolchain
        id: preflight
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          missing=()
          [ -n "$OPENCODE_API_KEY" ] || missing+=("OPENCODE_API_KEY")
          command -v curl >/dev/null 2>&1 || missing+=("curl")
          command -v jq >/dev/null 2>&1 || missing+=("jq")
          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "reason=infra"
              echo "detail=not ready: missing ${missing[*]}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! curl -fsSL --max-time 30 -o /dev/null https://opencode.ai/install; then
            {
              echo "reason=infra"
              echo "detail=cannot reach the opencode installer"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "reason=" >> "$GITHUB_OUTPUT"

      - name: Record the agent start
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.reason == ''
        run: date +%s > "$RUNNER_TEMP/opencode-agent-start"

      # Automated triage comments carry this marker and must run the read-only
      # `triage` agent, which cannot edit files, branch, commit or open PRs.
      # Manual /oc and /opencode comments keep the normal (build) agent.
      - name: Run OpenCode
        id: agent
        if: steps.preflight.outcome == 'success' && steps.preflight.outputs.reason == ''
        # Below the 360-minute job limit and the hosted-runner 6-hour cap, so a
        # timeout fails the step first and the reporting steps still get time.
        timeout-minutes: 345
        uses: anomalyco/opencode/github@17b79f4e0c16dcff200b0417567ed22aeb2d7166 # github-v1.2.28
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # AGENT_PUSH_TOKEN (PAT with the workflow scope) lets the agent edit
          # .github/workflows files; without it the run falls back to GITHUB_TOKEN,
          # which cannot touch workflow files.
          # TOKEN is what `opencode github run` reads to authenticate git pushes.
          TOKEN: ${{ secrets.AGENT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.AGENT_PUSH_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          model: opencode-go/deepseek-v4.1-flash
          agent: ${{ contains(github.event.comment.body, '<!-- opencode-auto-triage -->') && 'triage' || '' }}
          mentions: '/oc,/opencode'
          share: 'false'
          use_github_token: true

      - name: Classify the agent outcome
        id: classify
        if: always()
        env:
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREFLIGHT_REASON: ${{ steps.preflight.outputs.reason }}
          PREFLIGHT_DETAIL: ${{ steps.preflight.outputs.detail }}
          AGENT_OUTCOME: ${{ steps.agent.outcome }}
          AGENT_STEP_TIMEOUT_MINUTES: "345"
        run: |
          reason=""
          detail=""
          if [ -n "${PREFLIGHT_REASON:-}" ]; then
            reason="infra"
            detail="$PREFLIGHT_DETAIL"
          elif [ "$PREFLIGHT_OUTCOME" != "success" ]; then
            reason="infra"
            detail="the toolchain preflight did not run successfully ($PREFLIGHT_OUTCOME)"
          elif [ "$AGENT_OUTCOME" = "success" ]; then
            reason=""
            detail=""
          elif [ "$AGENT_OUTCOME" = "skipped" ]; then
            reason="infra"
            detail="the agent did not start because a setup step failed"
          elif [ ! -x "$HOME/.opencode/bin/opencode" ] ||
            ! "$HOME/.opencode/bin/opencode" --version >/dev/null 2>&1; then
            # The composite action installs the CLI into this directory. If it
            # is absent or broken, preparation failed before the model started.
            reason="infra"
            detail="the opencode CLI is missing or does not start"
          else
            elapsed=0
            if [ -f "$RUNNER_TEMP/opencode-agent-start" ]; then
              elapsed=$(( $(date +%s) - $(cat "$RUNNER_TEMP/opencode-agent-start") ))
            fi
            timeout_seconds=$(( AGENT_STEP_TIMEOUT_MINUTES * 60 - 300 ))
            if [ "$elapsed" -ge "$timeout_seconds" ]; then
              reason="timeout"
              detail="the agent invocation hit its ${AGENT_STEP_TIMEOUT_MINUTES}-minute timeout"
            else
              reason="agent_failed"
              detail="the agent step ended with '$AGENT_OUTCOME'"
            fi
          fi
          {
            echo "reason=$reason"
            echo "detail=$detail"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            exit 1
          fi

  outcome:
    # A separate job without the model. `needs` waits for the agent to stop, and
    # `always()` lets the report run after a failure, a timeout or a denied gate.
    needs: [budget, opencode]
    if: |
      always() &&
      (needs.budget.result == 'success' || needs.budget.result == 'failure') &&
      (
        needs.budget.result == 'failure' ||
        needs.budget.outputs.allowed == 'false' ||
        needs.opencode.result == 'failure' ||
        needs.opencode.result == 'cancelled' ||
        needs.opencode.outputs.reason != ''
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate and the report must run the trusted script from the
          # workflow's own commit, never a copy a pull request could change.
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish the report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ (github.event.issue.pull_request || github.event.pull_request) && 'true' || 'false' }}
          BUDGET_RESULT: ${{ needs.budget.result }}
          BUDGET_ALLOWED: ${{ needs.budget.outputs.allowed }}
          BUDGET_REASON: ${{ needs.budget.outputs.reason }}
          BUDGET_DETAIL: ${{ needs.budget.outputs.detail }}
          BUDGET_USED: ${{ needs.budget.outputs.used }}
          BUDGET_LIMIT: ${{ needs.budget.outputs.limit }}
          BUDGET_LAST_SHA: ${{ needs.budget.outputs.last_sha }}
          AGENT_RESULT: ${{ needs.opencode.result }}
          AGENT_REASON: ${{ needs.opencode.outputs.reason }}
          AGENT_DETAIL: ${{ needs.opencode.outputs.detail }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: bash .github/scripts/opencode-report.sh
