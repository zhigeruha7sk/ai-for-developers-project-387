name: app-audit

# Scheduled production audit of the deployed application. The workflow lives in
# the default branch: GitHub only runs `schedule` and shows the "Run workflow"
# button for `workflow_dispatch` when the file is on the default branch.
on:
  schedule:
    # 03:00 UTC = 08:00 Asia/Almaty. One run per day.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  # A second audit waits for the current one instead of running in parallel.
  group: app-audit
  cancel-in-progress: false

env:
  APP_URL: ${{ vars.APP_URL }}
  AUDIT_DIR: .audit
  # Pinned so the audit uses the same CLI on every run. The checksum is the
  # GitHub release asset digest for opencode-linux-x64.tar.gz.
  OPENCODE_VERSION: "1.19.6"
  OPENCODE_SHA256: "47734e08968b30cc22a0bffb6d9feeed76ad4aa743213a12122040392d09a057"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Checkout and prompt files.
      contents: read
      # The agent creates one issue per new finding through the dedupe script.
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate configuration
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          if [ -z "$APP_URL" ]; then
            echo "::error::Repository variable APP_URL is not set."
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *)
              echo "::error::APP_URL must start with https://"
              exit 1
              ;;
          esac
          if ! curl -fsS --max-time 30 "$APP_URL/api/health" >/dev/null; then
            echo "::error::APP_URL is not reachable at /api/health: $APP_URL"
            exit 1
          fi

      # Fail before the model is called when the key, curl, jq or the installer
      # is missing. This keeps an infrastructure failure out of the report.
      - name: Preflight the agent toolchain
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$OPENCODE_API_KEY" ] || missing+=("OPENCODE_API_KEY")
          command -v curl >/dev/null 2>&1 || missing+=("curl")
          command -v jq >/dev/null 2>&1 || missing+=("jq")
          command -v sha256sum >/dev/null 2>&1 || missing+=("sha256sum")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing required components: ${missing[*]}"
            exit 1
          fi

      - name: Install opencode
        env:
          OPENCODE_VERSION: ${{ env.OPENCODE_VERSION }}
          OPENCODE_SHA256: ${{ env.OPENCODE_SHA256 }}
        run: |
          set -euo pipefail
          # Do not pipe the vendor install script into bash: jactionlint flags an
          # unverified download and the script is not reproducible. Download the
          # pinned release asset and verify its published SHA-256 first.
          archive="$RUNNER_TEMP/opencode-linux-x64.tar.gz"
          install_dir="$HOME/.local/bin"
          curl -fsSL --retry 3 --max-time 180 -o "$archive" \
            "https://github.com/anomalyco/opencode/releases/download/v${OPENCODE_VERSION}/opencode-linux-x64.tar.gz"
          printf '%s  %s\n' "$OPENCODE_SHA256" "$archive" | sha256sum --check --status
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          chmod +x "$install_dir/opencode"
          echo "$install_dir" >>"$GITHUB_PATH"

      - name: Show the agent version
        run: opencode --version

      - name: Run the audit agent
        id: agent
        timeout-minutes: 15
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          # The agent uses GitHub CLI for the dedupe lookup and issue creation.
          # `issues: write` on the job is the only repository scope it receives.
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          APP_URL: ${{ vars.APP_URL }}
          AUDIT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          AUDIT_SHA: ${{ github.sha }}
          AUDIT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_DIR/evidence"
          {
            echo "# Контекст аудита"
            echo
            echo "- APP_URL: $APP_URL"
            echo "- Прогон: $AUDIT_RUN_URL"
            echo "- Коммит: $AUDIT_SHA"
            echo "- Репозиторий: $AUDIT_REPOSITORY"
            echo "- Дата (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >"$AUDIT_DIR/context.md"

          prompt="$(cat .github/prompts/app-audit.md)"
          # The log is the accessible agent transcript; it is uploaded as an
          # artifact and is never committed.
          NO_COLOR=1 opencode run \
            --model opencode-go/deepseek-v4.1-flash \
            --agent audit \
            "$prompt" 2>&1 | tee "$AUDIT_DIR/agent-output.log"

      - name: Check the report
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s "$AUDIT_DIR/report.md" ]; then
            echo "::error::The agent did not write $AUDIT_DIR/report.md."
            exit 1
          fi
          echo "Report size: $(wc -c <"$AUDIT_DIR/report.md") bytes"

      - name: Publish the report to the run summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Плановый аудит приложения"
            echo
            echo "- Прогон: $AUDIT_RUN_URL"
            echo "- APP_URL: $APP_URL"
            echo
            if [ -f "$AUDIT_DIR/report.md" ]; then
              cat "$AUDIT_DIR/report.md"
            else
              echo "Агент не создал отчёт. Смотрите артефакт и лог агента."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the report and the agent output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.AUDIT_DIR }}/
          if-no-files-found: warn
          retention-days: 30
