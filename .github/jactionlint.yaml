# yaml-language-server: $schema=https://raw.githubusercontent.com/jdx/jactionlint/main/schema/jactionlint-config.json

ignores:
  # The issue_comment trigger is required for the /oc comment integration: the agent
  # must start from a comment. Mitigations in the workflow: the job runs only for
  # OWNER/MEMBER/COLLABORATOR comments (author_association gate), the token is the
  # optional AGENT_PUSH_TOKEN (PAT with the workflow scope) or GITHUB_TOKEN limited to
  # contents/issues/pull-requests writes, OPENCODE_API_KEY is the only model secret,
  # only the default branch is checked out with persist-credentials: false.
  - rule: dangerous-triggers
    file: .github/workflows/opencode.yml
    reason: required by the /oc comment integration; gated by author_association, token limited to repo/issue/PR writes (PAT with workflow scope when provided), single model-key secret
    expires: "2027-05-19"

  # pull_request_target is deliberate: with pull_request GitHub runs the workflow
  # from the PR head for same-repo branches, so a PR could replace the request job
  # and print AGENT_PUSH_TOKEN. The base-branch definition below never checks out
  # or executes PR code; the PAT is exposed only to the review-limit check and
  # `gh pr comment`, the body is static, fork PRs are skipped, and only
  # Dependabot/Renovate are filtered as noise. See the README section "Авторевью
  # пулл-реквестов".
  - rule: dangerous-triggers
    file: .github/workflows/opencode-review.yml
    reason: pull_request_target keeps the workflow definition on the base branch; no checkout/PR code, static comment body, PAT only in the review-limit check and gh pr comment, fork PRs skipped, only Dependabot/Renovate filtered
    expires: "2027-05-19"
